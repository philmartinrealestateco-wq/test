[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wallet-analyzer"
version = "1.0.0"
description = "Read-only multi-chain wallet balance and activity analyzer"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.32",
    "pandas>=2.2",
    "openpyxl>=3.1",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
wallet-analyzer = "wallet_analyzer.cli:main"

[tool.setuptools.packages.find]
include = ["wallet_analyzer*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"
